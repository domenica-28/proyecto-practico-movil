version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: floreria_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mi_contrasena_123
      POSTGRES_DB: floreria_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: